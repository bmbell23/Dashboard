<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐳 Docker Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐳</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-orange: #FF9500;
            --dark-orange: #E67E00;
            --light-orange: #FFB84D;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --medium-gray: #2A2A2A;
            --light-gray: #CCCCCC;
            --white: #FFFFFF;
            --off-white: #F5F5F5;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --glow: 0 0 20px rgba(255, 149, 0, 0.3);
        }

        /* Top-left cluster */
        .health-wrapper {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 1001;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 0.4rem;
        }

        /* Top-right cluster: bookmarks only */
        .bookmarks-wrapper {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
        }

        .top-nav-buttons {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        /* Server Health nav button */
        .health-nav-btn {
            background: linear-gradient(135deg, var(--dark-gray) 0%, var(--medium-gray) 100%);
            border: 2px solid var(--medium-gray);
            border-radius: 0.75rem;
            padding: 0.6rem 0.9rem;
            color: var(--primary-orange);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
            white-space: nowrap;
        }
        .health-nav-btn span {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .health-nav-btn:hover {
            border-color: var(--primary-orange);
            box-shadow: var(--glow);
            color: var(--white);
        }

        .health-nav-btn.ok {
            border-color: rgba(52, 199, 89, 0.8);
            color: #34c759;
            box-shadow: 0 0 14px rgba(52, 199, 89, 0.25);
        }

        .health-nav-btn.warn {
            border-color: rgba(255, 159, 10, 0.85);
            color: #ff9f0a;
            box-shadow: 0 0 14px rgba(255, 159, 10, 0.25);
        }

        .health-nav-btn.crit {
            border-color: rgba(255, 69, 58, 0.9);
            color: #ff453a;
            box-shadow: 0 0 16px rgba(255, 69, 58, 0.3);
            animation: badge-pulse 1.5s infinite;
        }

        .health-nav-btn.unknown {
            border-color: var(--medium-gray);
            color: var(--primary-orange);
        }

        @keyframes badge-pulse {
            0%, 100% { box-shadow: none; }
            50%       { box-shadow: 0 0 10px rgba(255,69,58,0.6); }
        }

        .bookmarks-btn {
            background: linear-gradient(135deg, var(--dark-gray) 0%, var(--medium-gray) 100%);
            border: 2px solid var(--medium-gray);
            border-radius: 0.75rem;
            padding: 0.6rem 0.9rem;
            color: var(--primary-orange);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .bookmarks-btn:hover, .bookmarks-btn.active {
            border-color: var(--primary-orange);
            box-shadow: var(--glow);
            color: var(--white);
        }

        .bookmarks-btn span {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bm-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            width: 300px;
            max-height: 70vh;
            overflow-y: auto;
            background: var(--dark-gray);
            border: 1px solid var(--medium-gray);
            border-radius: 0.75rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            padding: 0.5rem 0;
        }

        .bm-dropdown.open { display: block; }

        .bm-dropdown::-webkit-scrollbar { width: 6px; }
        .bm-dropdown::-webkit-scrollbar-track { background: transparent; }
        .bm-dropdown::-webkit-scrollbar-thumb { background: var(--medium-gray); border-radius: 3px; }

        .bm-tree { list-style: none; padding: 0; margin: 0; }
        .bm-tree ul { list-style: none; padding-left: 1rem; margin: 0; }

        .bm-tree-item { margin: 0; }

        .bm-tree-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.1rem 0.75rem;
            cursor: pointer;
            transition: background 0.12s;
            color: var(--off-white);
            text-decoration: none;
            font-size: 0.88rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bm-tree-row:hover { background: var(--medium-gray); }

        .bm-tree-row i.folder-icon { color: var(--primary-orange); width: 1rem; text-align: center; flex-shrink: 0; }
        .bm-tree-row i.toggle-icon { width: 0.8rem; text-align: center; flex-shrink: 0; color: var(--light-gray); font-size: 0.65rem; }

        .bm-tree-name { overflow: hidden; text-overflow: ellipsis; }

        .bm-tree-item.collapsed > ul { display: none; }

        .bm-divider { height: 1px; background: var(--medium-gray); margin: 0.2rem 0; }

        .bm-manage-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0.75rem;
            color: var(--primary-orange);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.12s;
        }
        .bm-manage-link:hover { background: var(--medium-gray); color: var(--white); }

        .bm-empty {
            padding: 1.5rem 0.75rem;
            text-align: center;
            color: var(--light-gray);
            font-size: 0.85rem;
        }
        .bm-empty i { display: block; font-size: 1.5rem; color: var(--medium-gray); margin-bottom: 0.5rem; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 50%, var(--black) 100%);
            min-height: 100vh;
            padding: 1.5rem;
            color: var(--off-white);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            color: var(--white);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(255, 149, 0, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .category {
            margin-bottom: 1.5rem;
        }

        .category-title {
            color: var(--white);
            font-size: 1.3rem;
            margin-bottom: 0.75rem;
            padding-left: 0.75rem;
            border-left: 4px solid var(--primary-orange);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .service-card {
            background: linear-gradient(135deg, var(--dark-gray) 0%, var(--medium-gray) 100%);
            border: 2px solid var(--medium-gray);
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-orange), var(--dark-orange));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .service-card:hover::before {
            transform: scaleX(1);
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-orange);
            box-shadow: var(--glow);
        }

        .url-dot {
            width: 0.6rem;
            height: 0.6rem;
            border-radius: 50%;
            margin-left: auto;
            flex: 0 0 auto;
            background: #6b7280;
        }
        .url-dot.up { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .url-dot.down { background: #ef4444; box-shadow: 0 0 6px #ef4444; }
        .service-card.url-down { border-color: #ef4444; }

        .service-link {
            text-decoration: none;
            color: inherit;
            display: block;
            flex: 1;
        }

        .service-content {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .service-header {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .service-icon {
            font-size: 1.75rem;
            margin-right: 0.75rem;
            color: var(--primary-orange);
        }

        .service-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--white);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .service-description {
            color: var(--light-gray);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .service-url {
            color: var(--primary-orange);
            font-size: 0.8rem;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        .service-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .service-actions {
            display: flex;
            gap: 0.5rem;
        }

        .action-btn {
            flex: 1;
            padding: 0.5rem;
            border: none;
            border-radius: 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
        }

        .action-btn i {
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .restart-btn {
            background-color: transparent;
            color: var(--primary-orange);
            border: 1px solid var(--primary-orange);
        }

        .restart-btn:hover:not(:disabled) {
            background-color: var(--primary-orange);
            color: var(--black);
        }

        .recreate-btn {
            background-color: transparent;
            color: var(--light-orange);
            border: 1px solid var(--light-orange);
        }

        .recreate-btn:hover:not(:disabled) {
            background-color: var(--light-orange);
            color: var(--black);
        }

        .scan-btn {
            background-color: transparent;
            color: #4CAF50;
            border: 1px solid #4CAF50;
            padding: 0.4rem 0.75rem;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        .scan-btn:hover:not(:disabled) {
            background-color: #4CAF50;
            color: var(--black);
        }

        .download-btn {
            background-color: transparent;
            color: #2196F3;
            border: 1px solid #2196F3;
            padding: 0.4rem 0.75rem;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        .download-btn:hover:not(:disabled) {
            background-color: #2196F3;
            color: var(--black);
        }

        .apk-btn {
            flex: 0 0 auto;
            background-color: transparent;
            color: #4CAF50;
            border: 1px solid #4CAF50;
            padding: 0.5rem 0.65rem;
            text-decoration: none;
        }

        .apk-btn:hover {
            background-color: #4CAF50;
            color: var(--black);
        }

        .apk-btn i {
            font-size: 0.85rem;
        }

        .share-btn {
            background-color: transparent;
            color: #9C27B0;
            border: 1px solid #9C27B0;
            padding: 0.4rem 0.75rem;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        .share-btn:hover:not(:disabled) {
            background-color: #9C27B0;
            color: var(--white);
        }

        .stop-share-btn {
            background-color: transparent;
            color: #f44336;
            border: 1px solid #f44336;
            padding: 0.4rem 0.75rem;
            font-size: 0.7rem;
            white-space: nowrap;
        }

        .stop-share-btn:hover:not(:disabled) {
            background-color: #f44336;
            color: var(--white);
        }

        /* Share modal */
        .share-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 2000;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 0;
            overflow-y: auto;
        }
        .share-modal-overlay.open { display: flex; }

        .share-modal {
            background: var(--dark-gray);
            border: 1px solid var(--medium-gray);
            border-radius: 0.75rem;
            padding: 1.75rem;
            width: min(600px, 96vw);
            box-shadow: var(--shadow);
        }

        .share-modal h3 {
            margin: 0 0 1rem;
            font-size: 1.1rem;
            color: var(--off-white);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .share-modal label {
            display: block;
            font-size: 0.75rem;
            color: var(--light-gray);
            margin-bottom: 0.35rem;
            margin-top: 0.9rem;
        }

        .share-modal input[type="text"] {
            width: 100%;
            background: var(--medium-gray);
            border: 1px solid #444;
            border-radius: 0.4rem;
            color: var(--off-white);
            padding: 0.55rem 0.75rem;
            font-size: 0.85rem;
            box-sizing: border-box;
        }
        .share-modal input[type="text"]:focus { outline: none; border-color: #9C27B0; }

        /* Active share panel */
        .share-active-panel {
            background: #1a2a1a;
            border: 1px solid #2e5a2e;
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 1rem;
        }
        .share-active-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #81C784;
            margin-bottom: 0.4rem;
        }
        .share-active-header span { flex: 1; font-weight: 600; }
        .share-active-stop {
            background: transparent;
            border: 1px solid #f44336;
            color: #f44336;
            border-radius: 0.3rem;
            padding: 0.2rem 0.55rem;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .share-active-stop:hover { background: #f44336; color: #fff; }
        .share-active-url {
            display: block;
            color: #CE93D8;
            font-size: 0.8rem;
            font-weight: 600;
            word-break: break-all;
            text-decoration: none;
            margin-bottom: 0.4rem;
        }
        .share-active-url:hover { text-decoration: underline; }
        .share-active-paths {
            font-size: 0.7rem;
            color: #888;
            margin-top: 0.3rem;
        }

        /* Quick picks */
        .share-quick-picks {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }
        .share-quick-pick {
            background: transparent;
            border: 1px solid #555;
            border-radius: 2rem;
            color: var(--light-gray);
            font-size: 0.7rem;
            padding: 0.25rem 0.65rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .share-quick-pick:hover { border-color: #9C27B0; color: #CE93D8; }

        /* File browser */
        .filebrowser {
            border: 1px solid #444;
            border-radius: 0.4rem;
            overflow: hidden;
            margin-top: 0.4rem;
        }
        .filebrowser-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--medium-gray);
            padding: 0.45rem 0.6rem;
            border-bottom: 1px solid #444;
        }
        .filebrowser-up {
            background: transparent;
            border: 1px solid #555;
            color: var(--light-gray);
            border-radius: 0.3rem;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .filebrowser-up:hover:not(:disabled) { border-color: #9C27B0; color: #CE93D8; }
        .filebrowser-up:disabled { opacity: 0.35; cursor: default; }
        .filebrowser-path { font-size: 0.7rem; color: #CE93D8; word-break: break-all; flex: 1; }
        .filebrowser-list { max-height: 200px; overflow-y: auto; background: #1a1a1a; }
        .filebrowser-entry {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            cursor: pointer;
            border-bottom: 1px solid #222;
            transition: background 0.1s;
            user-select: none;
        }
        .filebrowser-entry:last-child { border-bottom: none; }
        .filebrowser-entry:hover { background: #2a1a33; }
        .filebrowser-entry.in-cart { background: #2a1a40; }
        .filebrowser-entry.in-cart .filebrowser-name { color: #CE93D8; }
        .filebrowser-entry i { width: 1rem; text-align: center; flex-shrink: 0; }
        .filebrowser-entry i.fa-folder { color: #FFB74D; }
        .filebrowser-entry i.fa-file-audio { color: #CE93D8; }
        .filebrowser-entry i.fa-file { color: #aaa; }
        .filebrowser-name { flex: 1; }
        .filebrowser-size { color: #666; font-size: 0.7rem; flex-shrink: 0; }
        .fb-add-dir {
            background: transparent;
            border: 1px solid #555;
            color: #888;
            border-radius: 0.25rem;
            padding: 0.1rem 0.35rem;
            font-size: 0.65rem;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 0.35rem;
        }
        .fb-add-dir:hover { border-color: #9C27B0; color: #CE93D8; }
        .filebrowser-empty { padding: 1rem; text-align: center; color: #555; font-size: 0.8rem; }
        .filebrowser-loading { padding: 1rem; text-align: center; color: #666; font-size: 0.8rem; }

        /* Cart */
        .share-cart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.75rem;
            font-size: 0.75rem;
            color: var(--light-gray);
        }
        .share-cart-clear {
            background: transparent;
            border: none;
            color: #666;
            font-size: 0.7rem;
            cursor: pointer;
            padding: 0;
        }
        .share-cart-clear:hover { color: #f44336; }
        .share-cart {
            border: 1px solid #333;
            border-radius: 0.4rem;
            background: #111;
            min-height: 2.5rem;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 0.35rem;
        }
        .cart-empty { padding: 0.6rem 0.75rem; color: #444; font-size: 0.75rem; font-style: italic; }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.75rem;
            font-size: 0.78rem;
            color: var(--off-white);
            border-bottom: 1px solid #1a1a1a;
        }
        .cart-item:last-child { border-bottom: none; }
        .cart-item i { color: #CE93D8; flex-shrink: 0; }
        .cart-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cart-remove {
            background: transparent;
            border: none;
            color: #555;
            cursor: pointer;
            padding: 0 0.2rem;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .cart-remove:hover { color: #f44336; }

        /* Starting status */
        .share-status-panel {
            margin-top: 0.75rem;
            background: var(--medium-gray);
            border-radius: 0.4rem;
            padding: 0.75rem;
            font-size: 0.8rem;
            display: none;
        }
        .share-status-panel.visible { display: block; }
        .share-status-url { color: #CE93D8; word-break: break-all; font-weight: 600; margin-top: 0.25rem; }
        .share-copy-btn {
            background: transparent;
            border: 1px solid #9C27B0;
            color: #CE93D8;
            border-radius: 0.3rem;
            padding: 0.25rem 0.6rem;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .share-copy-btn:hover { background: #9C27B0; color: var(--white); }

        /* Modal actions */
        .share-modal-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }
        .share-modal-actions button {
            flex: 1;
            padding: 0.6rem;
            border-radius: 0.4rem;
            font-size: 0.85rem;
            cursor: pointer;
            border: none;
            font-weight: 600;
            transition: opacity 0.15s;
        }
        .share-modal-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
        #share-start-btn { background: #9C27B0; color: var(--white); }
        #share-cancel-btn { background: var(--medium-gray); color: var(--light-gray); }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-btn.loading {
            position: relative;
            color: transparent;
        }

        .action-btn.loading::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border: 2px solid var(--primary-orange);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--medium-gray);
            color: var(--white);
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            border-left: 4px solid var(--primary-orange);
            box-shadow: var(--shadow);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
            max-width: 300px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {

<body>

    <!-- Reconnecting overlay -->
    <div id="reconnect-overlay" class="reconnect-overlay">
        <div class="reconnect-content">
            <i class="fas fa-sync-alt fa-spin reconnect-icon"></i>
            <h2>Dashboard is restarting...</h2>
            <p id="reconnect-status">Waiting for dashboard to come back online</p>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API_URL = 'http://100.69.184.113:8001/api';

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function restartContainer(serviceId) {
            const btn = event.target.closest('.restart-btn');
            btn.disabled = true;
            btn.classList.add('loading');

            try {
                const response = await fetch(`${API_URL}/restart/${serviceId}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    showToast(data.message || 'Container restarted successfully', 'success');
                } else {
                    showToast(data.error || 'Failed to restart container', 'error');
                }
            } catch (error) {
                showToast('Network error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        async function recreateContainer(serviceId) {
            const btn = event.target.closest('.recreate-btn');
            btn.disabled = true;
            btn.classList.add('loading');

            try {
                const response = await fetch(`${API_URL}/recreate/${serviceId}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    showToast(data.message || 'Container recreated successfully', 'success');
                } else {
                    showToast(data.error || 'Failed to recreate container', 'error');
                }
            } catch (error) {
                showToast('Network error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        function showReconnectOverlay(action) {
            const overlay = document.getElementById('reconnect-overlay');
            const status = document.getElementById('reconnect-status');
            overlay.querySelector('h2').textContent = action === 'recreate'
                ? 'Dashboard is rebuilding & restarting...'
                : 'Dashboard is restarting...';
            status.textContent = 'Waiting for dashboard to come back online...';
            overlay.classList.add('active');

            let attempts = 0;
            const maxAttempts = 120; // 2 minutes
            const pollInterval = setInterval(async () => {
                attempts++;
                status.textContent = `Waiting for dashboard to come back online... (${attempts}s)`;
                try {
                    const r = await fetch(`${API_URL}/health`, { signal: AbortSignal.timeout(2000) });
                    if (r.ok) {
                        clearInterval(pollInterval);
                        status.textContent = 'Dashboard is back! Reloading...';
                        setTimeout(() => window.location.reload(), 500);
                    }
                } catch (e) {
                    // Still down, keep polling
                }
                if (attempts >= maxAttempts) {
                    clearInterval(pollInterval);
                    status.textContent = 'Dashboard may still be starting. Try refreshing manually.';
                }
            }, 1000);
        }

        async function selfRestart() {
            if (!confirm('Restart the dashboard? It will be temporarily unavailable.')) return;
            const btn = event.target.closest('.restart-btn');
            btn.disabled = true;
            btn.classList.add('loading');
            try {
                await fetch(`${API_URL}/self/restart`, { method: 'POST' });
            } catch (e) { /* expected - server dies */ }
            showReconnectOverlay('restart');
        }

        async function selfRecreate() {
            if (!confirm('Rebuild & recreate the dashboard? This takes longer but picks up code changes.')) return;
            const btn = event.target.closest('.recreate-btn');
            btn.disabled = true;
            btn.classList.add('loading');
            try {
                await fetch(`${API_URL}/self/recreate`, { method: 'POST' });
            } catch (e) { /* expected - server dies */ }
            showReconnectOverlay('recreate');
        }

        async function scanJellyfin() {
            const btn = event.target.closest('.scan-btn');
            btn.disabled = true;
            btn.classList.add('loading');

            try {
                const response = await fetch(`${API_URL}/scan/jellyfin`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    showToast(data.message || 'Jellyfin library scan started', 'success');
                } else {
                    showToast(data.error || 'Failed to start Jellyfin scan', 'error');
                }
            } catch (error) {
                showToast('Network error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        async function scanAudiobookshelf() {
            const btn = event.target.closest('.scan-btn');
            btn.disabled = true;
            btn.classList.add('loading');

            try {
                const response = await fetch(`${API_URL}/scan/audiobookshelf`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    showToast(data.message || 'Audiobookshelf library scan started', 'success');
                } else {
                    showToast(data.error || 'Failed to start Audiobookshelf scan', 'error');
                }
            } catch (error) {
                showToast('Network error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        async function tagStash() {
            const btn = event.target.closest('.scan-btn');
            btn.disabled = true;
            btn.classList.add('loading');

            try {
                const response = await fetch(`${API_URL}/tag/stash`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    showToast(data.message || 'Stash auto-tagging started', 'success');
                } else {
                    showToast(data.error || 'Failed to start Stash tagging', 'error');
                }
            } catch (error) {
                showToast('Network error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        async function downloadYouTube() {
            // Prompt user for URL
            const url = prompt('Enter URL (YouTube, YouPorn, or other video site):');

            if (!url || url.trim() === '') {
                return;
            }

            const btn = event.target.closest('.download-btn');
            btn.disabled = true;
            btn.classList.add('loading');

            // Detect YouPorn (or other adult site) URLs — send to Stash library
            const isAdultSite = /youporn\.com|pornhub\.com|xvideos\.com|xhamster\.com/i.test(url);

            if (isAdultSite) {
                try {
                    const response = await fetch(`${API_URL}/download/stash-video`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: url.trim() })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        showToast(data.message || 'Stash video download started', 'success');
                    } else {
                        showToast(data.error || 'Failed to download video', 'error');
                    }
                } catch (error) {
                    showToast('Network error: ' + error.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.classList.remove('loading');
                }
                return;
            }

            // YouTube: ask for format
            const format = confirm('Download as video?\n\nOK = Video (MP4)\nCancel = Audio (MP3)') ? 'video' : 'mp3';

            try {
                const response = await fetch(`${API_URL}/download/youtube`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url.trim(), type: format })
                });
                const data = await response.json();

                if (response.ok) {
                    showToast(data.message || 'YouTube download started', 'success');
                } else {
                    showToast(data.error || 'Failed to start download', 'error');
                }
            } catch (error) {
                showToast('Network error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        async function downloadGallery() {
            const url = prompt('Enter gallery URL (Reddit, DeviantArt, Flickr, Coomer, etc.):');
            if (!url || url.trim() === '') return;

            const btn = event.target.closest('.download-btn');
            btn.disabled = true;
            btn.classList.add('loading');

            try {
                const response = await fetch(`${API_URL}/download/gallery`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url.trim() })
                });
                const data = await response.json();
                if (response.ok) {
                    showToast(data.message || 'Gallery download complete', 'success');
                } else {
                    showToast(data.error || 'Gallery download failed', 'error');
                }
            } catch (error) {
                showToast('Network error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        }

        // --- Fileshare ---
        let _shareUrl = null;
        let _fbCurrentPath = null;
        let _shareCart = []; // [{path, name, isDir}]

        function _fmtSize(bytes) {
            if (bytes == null) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(2) + ' GB';
        }

        function _fileIcon(entry) {
            if (entry.is_dir) return 'fas fa-folder';
            const ext = (entry.name.split('.').pop() || '').toLowerCase();
            const audio = ['mp3','m4b','m4a','ogg','flac','aac','opus','wav'];
            const video = ['mp4','mkv','avi','mov','wmv','webm'];
            const image = ['jpg','jpeg','png','gif','webp','svg'];
            if (audio.includes(ext)) return 'fas fa-file-audio';
            if (video.includes(ext)) return 'fas fa-file-video';
            if (image.includes(ext)) return 'fas fa-file-image';
            return 'fas fa-file';
        }

        // ----- Cart -----
        function cartAdd(path, name, isDir) {
            if (_shareCart.some(i => i.path === path)) return; // already in cart
            _shareCart.push({ path, name, isDir });
            renderCart();
        }

        function cartRemove(path) {
            _shareCart = _shareCart.filter(i => i.path !== path);
            renderCart();
            // refresh in-cart highlights in file list
            document.querySelectorAll('#fb-list .filebrowser-entry').forEach(el => {
                if (el.dataset.path === path) el.classList.remove('in-cart');
            });
        }

        function cartClear() {
            _shareCart = [];
            renderCart();
            document.querySelectorAll('#fb-list .filebrowser-entry.in-cart')
                .forEach(el => el.classList.remove('in-cart'));
        }

        function renderCart() {
            const el = document.getElementById('share-cart');
            const count = document.getElementById('cart-count');
            count.textContent = _shareCart.length;
            if (!_shareCart.length) {
                el.innerHTML = '<div class="cart-empty">No files added yet</div>';
                return;
            }
            el.innerHTML = _shareCart.map(item => `
                <div class="cart-item">
                    <i class="${item.isDir ? 'fas fa-folder' : 'fas fa-file'}"></i>
                    <span class="cart-item-name" title="${item.path}">${item.name}</span>
                    <button class="cart-remove" data-cart-remove="${item.path.replace(/"/g,'&quot;')}" title="Remove">
                        <i class="fas fa-times"></i>
                    </button>
                </div>`).join('');
        }

        // ----- File browser -----
        let _lastFileClickIdx = null;

        async function browseNav(path) {
            _fbCurrentPath = path;
            _lastFileClickIdx = null;
            const list = document.getElementById('fb-list');
            const pathEl = document.getElementById('fb-path');
            const upBtn = document.getElementById('fb-up-btn');
            list.innerHTML = '<div class="filebrowser-loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div>';
            pathEl.textContent = path;
            upBtn.disabled = path === '/';
            try {
                const r = await fetch(`${API_URL}/browse?path=${encodeURIComponent(path)}`);
                const d = await r.json();
                if (!r.ok) { list.innerHTML = `<div class="filebrowser-empty">${d.error}</div>`; return; }
                if (!d.entries.length) { list.innerHTML = '<div class="filebrowser-empty">Empty directory</div>'; return; }
                list.innerHTML = d.entries.map(e => {
                    const inCart = _shareCart.some(i => i.path === e.path) ? ' in-cart' : '';
                    const right = e.is_dir
                        ? `<button class="fb-add-dir" data-add-dir="${e.path.replace(/"/g,'&quot;')}" data-add-dir-name="${e.name.replace(/"/g,'&quot;')}" title="Add folder to cart"><i class="fas fa-plus"></i></button>`
                        : `<span class="filebrowser-size">${_fmtSize(e.size)}</span>`;
                    return `<div class="filebrowser-entry${inCart}"
                                 data-path="${e.path.replace(/"/g,'&quot;')}"
                                 data-name="${e.name.replace(/"/g,'&quot;')}"
                                 data-isdir="${e.is_dir}">
                                <i class="${_fileIcon(e)}"></i>
                                <span class="filebrowser-name">${e.name}</span>
                                ${right}
                            </div>`;
                }).join('');
            } catch(e) {
                list.innerHTML = `<div class="filebrowser-empty">Error: ${e.message}</div>`;
            }
        }

        function browseUp() {
            if (!_fbCurrentPath) return;
            const parent = _fbCurrentPath.replace(/\/+$/, '').split('/').slice(0, -1).join('/') || '/';
            browseNav(parent);
        }

        function fbAddCurrentDir() {
            if (!_fbCurrentPath) return;
            const name = _fbCurrentPath.replace(/\/+$/, '').split('/').pop() || _fbCurrentPath;
            cartAdd(_fbCurrentPath, name, true);
        }

        // Event delegation for file browser clicks
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('fb-list').addEventListener('click', function(e) {
                // Folder + button — add dir to cart without navigating
                const addDirBtn = e.target.closest('[data-add-dir]');
                if (addDirBtn) {
                    cartAdd(addDirBtn.dataset.addDir, addDirBtn.dataset.addDirName, true);
                    return;
                }

                const entry = e.target.closest('.filebrowser-entry');
                if (!entry) return;
                const path = entry.dataset.path;
                const name = entry.dataset.name;
                const isDir = entry.dataset.isdir === 'true';

                if (isDir) {
                    browseNav(path);
                    return;
                }

                // File click — support shift+click range select
                const allEntries = [...document.querySelectorAll('#fb-list .filebrowser-entry[data-isdir="false"]')];
                const idx = allEntries.indexOf(entry);

                if (e.shiftKey && _lastFileClickIdx !== null) {
                    const start = Math.min(_lastFileClickIdx, idx);
                    const end   = Math.max(_lastFileClickIdx, idx);
                    for (let i = start; i <= end; i++) {
                        const el = allEntries[i];
                        const p = el.dataset.path, n = el.dataset.name;
                        if (!_shareCart.some(c => c.path === p)) {
                            cartAdd(p, n, false);
                            el.classList.add('in-cart');
                        }
                    }
                } else {
                    if (_shareCart.some(c => c.path === path)) {
                        cartRemove(path);
                        entry.classList.remove('in-cart');
                    } else {
                        cartAdd(path, name, false);
                        entry.classList.add('in-cart');
                    }
                    _lastFileClickIdx = idx;
                }
            });

            // Cart remove buttons (delegated)
            document.getElementById('share-cart').addEventListener('click', function(e) {
                const btn = e.target.closest('[data-cart-remove]');
                if (!btn) return;
                cartRemove(btn.dataset.cartRemove);
            });

            // ESC closes modal; click overlay background closes modal
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') closeShareModal();
            });
            document.getElementById('share-modal-overlay').addEventListener('click', e => {
                if (e.target === document.getElementById('share-modal-overlay')) closeShareModal();
            });
        });

        // ----- Share status / badge -----
        async function checkShareStatus() {
            try {
                const r = await fetch(`${API_URL}/share/status`);
                const d = await r.json();
                const badge = document.getElementById('fileshare-url-badge');
                const copyBtn = document.getElementById('fileshare-copy-btn');
                const stopBtn = document.getElementById('fileshare-stop-btn');
                if (d.running) {
                    _shareUrl = d.url;
                    if (badge) {
                        badge.textContent = d.url ? d.url.replace('http://', '') : 'tunnel starting…';
                        badge.style.color = '#CE93D8';
                    }
                    if (copyBtn) { copyBtn.disabled = !d.url; }
                    if (stopBtn) { stopBtn.disabled = false; }
                } else {
                    _shareUrl = null;
                    if (badge) badge.textContent = '';
                    if (copyBtn) { copyBtn.disabled = true; }
                    if (stopBtn) { stopBtn.disabled = true; }
                }
                _updateActivePanel(d);
            } catch (_) {}
        }

        function _updateActivePanel(status) {
            const panel = document.getElementById('share-active-panel');
            if (!status || !status.running) {
                panel.style.display = 'none';
                return;
            }
            panel.style.display = '';
            const urlEl = document.getElementById('share-active-url');
            urlEl.textContent = status.url || 'Tunnel starting…';
            urlEl.href = status.url || '#';
            const pathsEl = document.getElementById('share-active-paths');
            if (status.paths && status.paths.length) {
                pathsEl.textContent = status.paths.join(' · ');
            } else {
                pathsEl.textContent = '';
            }
        }

        // ----- Modal open / close -----
        function openShareModal() {
            document.getElementById('share-modal-overlay').classList.add('open');
            document.getElementById('share-status-panel').classList.remove('visible');
            document.getElementById('share-start-btn').disabled = false;
            document.getElementById('share-start-btn').innerHTML = '<i class="fas fa-play"></i> Start Share';
            checkShareStatus();
        }

        function closeShareModal() {
            document.getElementById('share-modal-overlay').classList.remove('open');
        }

        // ----- Clipboard -----
        function _copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            }
            const el = document.createElement('textarea');
            el.value = text;
            el.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
            document.body.appendChild(el);
            el.focus(); el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            return Promise.resolve();
        }

        function copyShareUrl() {
            if (_shareUrl) {
                _copyText(_shareUrl).then(() => showToast('URL copied!', 'success'));
            }
        }

        // ----- Start / Stop -----
        async function startShare() {
            if (!_shareCart.length) { showToast('Add at least one file or folder to the cart first', 'error'); return; }
            const title = document.getElementById('share-title-input').value.trim();

            const startBtn = document.getElementById('share-start-btn');
            startBtn.disabled = true;
            startBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Starting…';

            const panel = document.getElementById('share-status-panel');
            panel.classList.add('visible');
            document.getElementById('share-status-label').textContent = 'Starting tunnel — this may take up to 20 seconds…';
            document.getElementById('share-status-url').textContent = '';
            document.getElementById('share-copy-btn').style.display = 'none';

            try {
                const r = await fetch(`${API_URL}/share/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paths: _shareCart.map(i => i.path), title })
                });
                const d = await r.json();
                if (r.ok) {
                    _shareUrl = d.url;
                    document.getElementById('share-status-label').textContent = d.url ? '✓ Share is live:' : '✓ Running (URL still loading)';
                    document.getElementById('share-status-url').textContent = d.url || '';
                    if (d.url) {
                        document.getElementById('share-copy-btn').style.display = '';
                        _copyText(d.url).catch(() => {});
                        showToast('Share started — URL copied!', 'success');
                    } else {
                        showToast('Share started', 'success');
                    }
                    checkShareStatus();
                } else {
                    document.getElementById('share-status-label').textContent = 'Error: ' + (d.error || 'unknown');
                    showToast(d.error || 'Failed to start share', 'error');
                    startBtn.disabled = false;
                    startBtn.innerHTML = '<i class="fas fa-play"></i> Start Share';
                }
            } catch (e) {
                document.getElementById('share-status-label').textContent = 'Network error';
                showToast('Network error: ' + e.message, 'error');
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fas fa-play"></i> Start Share';
            }
        }

        async function stopShare() {
            try {
                const r = await fetch(`${API_URL}/share/stop`, { method: 'POST' });
                const d = await r.json();
                if (r.ok) {
                    showToast('Fileshare stopped', 'success');
                    checkShareStatus();
                    document.getElementById('share-status-panel').classList.remove('visible');
                } else {
                    showToast(d.error || 'Failed to stop share', 'error');
                }
            } catch (e) {
                showToast('Network error: ' + e.message, 'error');
            }
        }

        // Poll share status on page load
        checkShareStatus();

        // --- Bookmarks Dropdown ---
        const bmToggle = document.getElementById('bookmarks-toggle');
        const bmDropdown = document.getElementById('bm-dropdown');
        const bmContainer = document.getElementById('bm-tree-container');
        let bmData = [];

        bmToggle.addEventListener('click', async (e) => {
            e.stopPropagation();
            const isOpen = bmDropdown.classList.toggle('open');
            bmToggle.classList.toggle('active', isOpen);
            if (isOpen) {
                try {
                    const r = await fetch('/api/bookmarks');
                    bmData = await r.json();
                    renderBmTree();
                } catch (err) {
                    bmContainer.innerHTML = '<div class="bm-empty"><i class="fas fa-exclamation-triangle"></i>Failed to load bookmarks</div>';
                }
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.bookmarks-wrapper')) {
                bmDropdown.classList.remove('open');
                bmToggle.classList.remove('active');
            }
        });

        function buildBmTree(parentId) {
            const items = bmData.filter(b => (b.parent_id || null) === parentId);
            if (!items.length) return '';
            let html = '<ul class="bm-tree">';
            for (const item of items) {
                const isFolder = item.type === 'folder';
                const children = isFolder ? buildBmTree(item.id) : '';
                if (isFolder) {
                    const toggle = `<i class="toggle-icon fas fa-chevron-right"></i>`;
                    html += `<li class="bm-tree-item collapsed">
                        <div class="bm-tree-row" onclick="toggleBmFolder(this)">${toggle}<i class="folder-icon fas fa-folder"></i><span class="bm-tree-name">${bmEsc(item.name)}</span></div>
                        ${children}
                    </li>`;
                } else {
                    html += `<li class="bm-tree-item">
                        <a class="bm-tree-row" href="${bmEsc(item.url)}" target="_blank"><span class="bm-tree-name">${bmEsc(item.name)}</span></a>
                    </li>`;
                }
            }
            html += '</ul>';
            return html;
        }

        function renderBmTree() {
            const tree = buildBmTree(null);
            bmContainer.innerHTML = tree || '<div class="bm-empty"><i class="fas fa-bookmark"></i>No bookmarks yet</div>';
        }

        function bmEsc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

        function toggleBmFolder(el) {
            const li = el.closest('.bm-tree-item');
            const isExpanding = li.classList.contains('collapsed');
            if (isExpanding) {
                // Collapse all siblings and their descendants
                const parentUl = li.parentElement;
                parentUl.querySelectorAll(':scope > .bm-tree-item').forEach(sibling => {
                    if (sibling !== li) {
                        sibling.classList.add('collapsed');
                        sibling.querySelectorAll('.bm-tree-item').forEach(desc => {
                            desc.classList.add('collapsed');
                            const descIcon = desc.querySelector(':scope > .bm-tree-row .toggle-icon');
                            if (descIcon) descIcon.className = 'toggle-icon fas fa-chevron-right';
                        });
                        const sibIcon = sibling.querySelector(':scope > .bm-tree-row .toggle-icon');
                        if (sibIcon) sibIcon.className = 'toggle-icon fas fa-chevron-right';
                    }
                });
            }
            li.classList.toggle('collapsed');
            const icon = el.querySelector('.toggle-icon');
            icon.className = li.classList.contains('collapsed') ? 'toggle-icon fas fa-chevron-right' : 'toggle-icon fas fa-chevron-down';
        }

        // ── Service list (#6) ────────────────────────────────────────────
        // Rendered from /api/services: static/services.json merged with container state,
        // the page check and running preview containers (dashboard.preview.* labels).
        (function initServices() {
            const root = document.getElementById('svc-root');
            const summary = document.getElementById('svc-summary');
            const search = document.getElementById('svc-search');
            let data = null;

            const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
                c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

            function health(s) {
                const c = s.container || {}, p = s.page;
                if (c.state === 'stopped' || c.state === 'missing') return ['down', `Container ${c.name}: ${c.state}`];
                if (p && !p.ok) return ['down', `Page down: ${p.error || 'HTTP ' + p.code}`];
                if (c.health === 'unhealthy') return ['warn', `Container ${c.name}: unhealthy`];
                if (c.health === 'starting') return ['warn', `Container ${c.name}: starting`];
                if (p && p.ok) return ['up', `Page up: HTTP ${p.code}, ${p.ms} ms`];
                if (c.state === 'running') return ['up', `Container ${c.name}: ${c.status}`];
                return ['', 'Not checked'];
            }

            function extraChip(x) {
                const label = x.label ? esc(x.label) : '';
                const icon = `<i class="${esc(x.icon)}"></i>`;
                const title = esc(x.title || x.label || '');
                const id = x.id ? ` id="${esc(x.id)}"` : '';
                if (x.href) return `<a class="chip"${id} href="${esc(x.href)}" target="_blank" rel="noopener" title="${title}">${icon} ${label}</a>`;
                return `<button class="chip"${id} onclick="${esc(x.onclick)}" title="${title}"${x.disabled ? ' disabled' : ''}>${icon} ${label}</button>`;
            }

            function row(s) {
                const [state, why] = health(s);
                const target = s.url && s.url.startsWith('http') ? ' target="_blank" rel="noopener"' : '';
                const main = s.url
                    ? `<a class="svc-main" href="${esc(s.url)}"${target} title="${esc(s.url_label || s.url)}">`
                    : `<div class="svc-main">`;
                // Each preview: the running review copy, plus the PR on GitHub to approve it.
                const previews = (s.previews || []).map(p =>
                    `<span class="chip-pair"><a class="chip preview" href="${esc(p.url)}" target="_blank" rel="noopener" title="Open the review copy: ${esc(p.container)} on :${p.port}">` +
                    `<i class="fas fa-flask"></i> ${p.pr != null ? 'PR #' + p.pr : 'preview'}</a>` +
                    (p.pr != null && s.repo
                        ? `<a class="chip preview pr-link" href="https://github.com/${esc(s.repo)}/pull/${p.pr}" target="_blank" rel="noopener" title="Review and merge on GitHub: ${esc(s.repo)}#${p.pr}"><i class="fab fa-github"></i></a>`
                        : '') + `</span>`).join('');
                const apk = s.apk
                    ? `<a class="svc-menu-link" href="${esc(s.apk)}" target="_blank" rel="noopener"><i class="fas fa-mobile-screen-button"></i> Download phone app</a>` : '';
                const menu = apk + (s.controls === 'container'
                    ? `<button onclick="restartContainer('${esc(s.key)}')"><i class="fas fa-redo"></i> Restart</button>
                       <button onclick="recreateContainer('${esc(s.key)}')"><i class="fas fa-hammer"></i> Recreate</button>`
                    : s.controls === 'self'
                    ? `<button onclick="selfRestart()"><i class="fas fa-redo"></i> Restart</button>
                       <button onclick="selfRecreate()"><i class="fas fa-hammer"></i> Recreate</button>` : '');
                return `<div class="svc-row ${state === 'down' ? 'down' : ''}" data-key="${esc(s.key)}">
                    <span class="svc-dot ${state}" title="${esc(why)}"></span>
                    <i class="svc-icon ${esc(s.icon)}"></i>
                    ${main}
                        <div class="svc-name">${esc(s.name)}</div>
                        <div class="svc-desc">${esc(s.description || '')}</div>
                    ${s.url ? '</a>' : '</div>'}
                    <div class="svc-chips">
                        ${previews}
                        ${(s.extras || []).map(extraChip).join('')}
                        ${s.owner ? `<span class="chip owner" title="Owner">@${esc(s.owner)}</span>` : ''}
                    </div>
                    ${menu ? `<button class="svc-menu-btn" title="More" onclick="toggleSvcMenu(event, '${esc(s.key)}')"><i class="fas fa-ellipsis-vertical"></i></button>
                    <div class="svc-menu" id="svc-menu-${esc(s.key)}" onclick="event.stopPropagation()">${menu}<div class="hint">${esc((s.container || {}).name || '')}</div></div>` : ''}
                </div>`;
            }

            function matches(s, q) {
                if (!q) return true;
                const hay = [s.name, s.description, s.url_label, s.owner, s.key, s.category,
                             ...(s.previews || []).map(p => 'pr' + p.pr)].join(' ').toLowerCase();
                return q.split(/\s+/).every(t => hay.includes(t));
            }

            function group(title, icon, items) {
                if (!items.length) return '';
                return `<div class="svc-group">
                    <div class="svc-group-title"><i class="${esc(icon)}"></i> ${esc(title)} <span class="count">${items.length}</span></div>
                    <div class="svc-list">${items.map(row).join('')}</div></div>`;
            }

            // Open PRs in every repo, container or not (docker#80 writes the list on the host).
            function age(iso) {
                const h = (Date.now() - new Date(iso)) / 3.6e6;
                return h < 1 ? `${Math.max(1, Math.round(h * 60))}m` : h < 48 ? `${Math.round(h)}h` : `${Math.round(h / 24)}d`;
            }
            function openPrs(q) {
                const o = data.open_prs || {};
                const found = (o.prs || []).filter(p => !q || q.split(/\s+/).every(t =>
                    [p.repo, '#' + p.number, 'pr' + p.number, p.title, p.agent, p.branch].join(' ').toLowerCase().includes(t)));
                // A PR with a running review copy is already under Needs attention (its service row has the PR link).
                const prs = found.filter(p => !p.preview_url);
                const above = found.length - prs.length;
                if (!prs.length && !o.stale) return '';
                const rows = prs.map(p => `<div class="svc-row">
                    <i class="svc-icon fab fa-github"></i>
                    <a class="svc-main" href="${esc(p.url)}" target="_blank" rel="noopener" title="${esc(p.branch || '')}">
                        <div class="svc-name">${esc(p.repo)} #${p.number}</div>
                        <div class="svc-desc">${esc(p.title)}</div></a>
                    <div class="svc-chips">
                        ${p.is_draft ? '<span class="chip">draft</span>' : ''}
                        ${p.agent ? `<span class="chip owner">@${esc(p.agent)}</span>` : ''}
                        <span class="chip" title="${esc(p.created_at)}">${age(p.created_at)}</span>
                    </div></div>`).join('');
                return `<div class="svc-group">
                    <div class="svc-group-title"><i class="fab fa-github"></i> Open PRs <span class="count">${prs.length}</span>
                        ${above ? `<span class="count">· ${above} with a review copy, under Needs attention</span>` : ''}
                        ${o.stale ? `<span class="count" style="color:#f59e0b">· ${esc(o.stale)}</span>` : ''}</div>
                    <div class="svc-list">${rows}</div></div>`;
            }

            function render() {
                if (!data) return;
                const q = search.value.trim().toLowerCase();
                const all = data.services;
                const shown = all.filter(s => matches(s, q));
                const states = all.map(s => health(s)[0]);
                const nPreviews = all.reduce((n, s) => n + (s.previews || []).length, 0);
                summary.innerHTML = `<span><b>${all.length}</b> services</span>
                    <span><b>${states.filter(x => x === 'up').length}</b> up</span>
                    ${states.includes('down') ? `<span style="color:#ef4444"><b>${states.filter(x => x === 'down').length}</b> down</span>` : ''}
                    ${states.includes('warn') ? `<span style="color:#f59e0b"><b>${states.filter(x => x === 'warn').length}</b> degraded</span>` : ''}
                    ${nPreviews ? `<span style="color:#e9d5ff"><b>${nPreviews}</b> preview${nPreviews > 1 ? 's' : ''}</span>` : ''}`;

                // Pinned on top: anything down/degraded, and anything with a preview waiting for review.
                const attention = shown.filter(s => ['down', 'warn'].includes(health(s)[0]) || (s.previews || []).length);
                let out = group('Needs attention', 'fas fa-triangle-exclamation', attention);
                if ((data.unmatched_previews || []).length) {
                    // Right under Needs attention: a preview that matches no service must not hide at the bottom.
                    out += group('Previews without a service', 'fas fa-flask', data.unmatched_previews.map(p => ({
                        key: p.container, name: p.container, icon: 'fas fa-flask', description: `label project "${p.project}" matches no service`,
                        url: p.url, url_label: ':' + p.port, previews: [], extras: [], container: {}, page: null })));
                }
                out += openPrs(q);
                for (const c of data.categories) {
                    out += group(c.name, c.icon, shown.filter(s => s.category === c.name && !attention.includes(s))
                                                    .sort((a, b) => a.name.localeCompare(b.name)));
                }
                root.innerHTML = out || '<div class="svc-empty">No services match.</div>';
                if (typeof checkShareStatus === 'function') checkShareStatus();
            }

            window.toggleSvcMenu = function (ev, key) {
                ev.stopPropagation();
                const m = document.getElementById('svc-menu-' + key);
                const wasOpen = m.classList.contains('open');
                document.querySelectorAll('.svc-menu.open').forEach(x => x.classList.remove('open'));
                if (!wasOpen) m.classList.add('open');
            };
            document.addEventListener('click', () =>
                document.querySelectorAll('.svc-menu.open').forEach(x => x.classList.remove('open')));

            function load() {
                if (document.querySelector('.svc-menu.open')) return;  // don't redraw under an open menu
                fetch('/api/services')
                    .then(r => r.ok ? r.json() : Promise.reject(r.status))
                    .then(d => { data = d; render(); })
                    .catch(() => { if (!data) root.innerHTML = '<div class="svc-empty">Could not load /api/services.</div>'; });
            }
            search.addEventListener('input', render);
            load();
            setInterval(load, 30_000);
        })();

        // ── Health button status color ───────────────────────────────────
        (function initHealthButtonStatus() {
            const btn = document.getElementById('health-nav-btn');
            const LABELS = {
                ok:      { icon: 'fa-heartbeat', text: 'Server Health: OK' },
                warn:    { icon: 'fa-triangle-exclamation', text: 'Server Health: Degraded' },
                crit:    { icon: 'fa-skull-crossbones', text: 'Server Health: Critical' },
                unknown: { icon: 'fa-circle-notch', text: 'Server Health: Checking' },
            };

            function updateButton(status) {
                const s = LABELS[status] || LABELS.unknown;
                btn.className = `health-nav-btn ${status}`;
                btn.innerHTML = `<i class="fas ${s.icon}${status === 'unknown' ? ' fa-spin' : ''}"></i><span>Server Health</span>`;
                btn.title = s.text;
            }

            function fetchStatus() {
                fetch('/api/infra/status')
                    .then(r => r.ok ? r.json() : Promise.reject(r.status))
                    .then(d => updateButton(d.overall || 'unknown'))
                    .catch(() => updateButton('unknown'));
            }

            fetchStatus();
            setInterval(fetchStatus, 60_000);
        })();
    </script>
</body>
</html>
