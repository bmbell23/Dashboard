# Service alerts from the Dashboard's card probe (#66): every card URL in
# static/services.json, probed every 60s at the address Brandon opens, exported
# on :8001/metrics and scraped as job "dashboard-cards" (docker/monitoring).
# 4 Oct 2026: Romm crash-looped 536 times and Jackett lost its network; the
# card probe saw both, Prometheus saw neither, and Mongo said nothing.
groups:
  - name: services
    rules:
      - alert: ServiceDown
        expr: dashboard_card_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.name }} is down: {{ $labels.url }} does not answer (owner: {{ $labels.owner }})"

      # The probe loop is a thread in the Dashboard; if it dies, every card freezes on its last answer.
      - alert: CardProbesStale
        expr: time() - max(dashboard_card_probe_timestamp_seconds) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The Dashboard has not probed the service cards for {{ $value | humanizeDuration }}"

      # Without the Dashboard there is no ServiceDown at all. Say so.
      - alert: DashboardProbesDown
        expr: up{job="dashboard-cards"} == 0 or absent(up{job="dashboard-cards"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape the Dashboard (:8001/metrics); service-down alerts are blind"
