# promtool unit tests for monitoring/rules. Run: monitoring/check.sh
rule_files:
  - ../rules/host.yml

evaluation_interval: 30s

tests:
  # 30 Sep 2026: Jellyfin trickplay pinned one core of four at nice 10.
  # Niced work yields to everything else and must never page.
  - name: niced CPU does not fire
    interval: 30s
    input_series:
      - series: 'node_cpu_seconds_total{instance="dockerhost",cpu="0",mode="nice"}'
        values: '0+30x60'
      - series: 'node_cpu_seconds_total{instance="dockerhost",cpu="0",mode="idle"}'
        values: '0+0x60'
      - series: 'node_cpu_seconds_total{instance="dockerhost",cpu="1",mode="idle"}'
        values: '0+30x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: HostCPUSaturated
        exp_alerts: []

  - name: sustained real CPU fires after 15m, not before
    interval: 30s
    input_series:
      - series: 'node_cpu_seconds_total{instance="dockerhost",cpu="0",mode="user"}'
        values: '0+30x80'
      - series: 'node_cpu_seconds_total{instance="dockerhost",cpu="0",mode="idle"}'
        values: '0+0x80'
    alert_rule_test:
      - eval_time: 10m
        alertname: HostCPUSaturated
        exp_alerts: []
      - eval_time: 30m
        alertname: HostCPUSaturated
        exp_alerts:
          - exp_labels: {severity: warning, instance: dockerhost}
            exp_annotations:
              summary: "dockerhost CPU is 100% busy (excluding niced work) for 15m"

  # 101 GB disk at 90% used: warning only.
  - name: disk at 90% warns, does not go critical
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="dockerhost",mountpoint="/",fstype="ext4"}'
        values: '100x30'
      - series: 'node_filesystem_avail_bytes{instance="dockerhost",mountpoint="/",fstype="ext4"}'
        values: '10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: HostDiskUsage
        exp_alerts:
          - exp_labels: {severity: warning, instance: dockerhost, mountpoint: /, fstype: ext4}
            exp_annotations:
              summary: "dockerhost / is 90% full"

  # Jan 7: a disk filling up. 60% used, losing 3% an hour: 84% at 8h (under the 85% threshold), full in ~5h more.
  - name: disk trending to full warns before the threshold
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="dockerhost",mountpoint="/mnt/docker",fstype="ext4"}'
        values: '100x600'
      - series: 'node_filesystem_avail_bytes{instance="dockerhost",mountpoint="/mnt/docker",fstype="ext4"}'
        values: '40-0.05x600'
    alert_rule_test:
      - eval_time: 8h
        alertname: HostDiskFillingFast
        exp_alerts:
          - exp_labels: {severity: warning, instance: dockerhost, mountpoint: /mnt/docker, fstype: ext4}
            exp_annotations:
              summary: "dockerhost /mnt/docker will be full within 24h at the current rate"

  - name: a stable full-ish disk does not trip the trend alert
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="dockerhost",mountpoint="/mnt/boston",fstype="ext4"}'
        values: '100x600'
      - series: 'node_filesystem_avail_bytes{instance="dockerhost",mountpoint="/mnt/boston",fstype="ext4"}'
        values: '20x600'
    alert_rule_test:
      - eval_time: 8h
        alertname: HostDiskFillingFast
        exp_alerts: []

  - name: target down for 5m is critical
    interval: 1m
    input_series:
      - series: 'up{job="node",instance="pve01"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 6m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: critical, job: node, instance: pve01}
            exp_annotations:
              summary: "node on pve01 has been unreachable for 5m"
